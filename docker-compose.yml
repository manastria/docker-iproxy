services:
  docker-registry-cache:
    image: registry:2 # L'image officielle du Docker Registry : https://hub.docker.com/_/registry
    container_name: docker-cache # Un nom facile à identifier pour votre conteneur
    restart: always # Redémarre toujours le conteneur s'il s'arrête
    ports:
      - "5000:5000" # Mappe le port 5000 du conteneur au port 5000 de l'hôte
    volumes:
      # Monte le fichier de configuration dans le conteneur
      - ./config.yml:/etc/docker/registry/config.yml:ro
      # Monte un volume persistant pour stocker les images en cache.
      # Remplacez /chemin/vers/votre/dossier/de/stockage par le chemin réel sur votre hôte.
      - ./docker-cache:/var/lib/registry
    environment:
      - HTTP_PROXY=${SQUID_PROXY_ADDR}
      - HTTPS_PROXY=${SQUID_PROXY_ADDR}
      # Important : Ajoutez le nom du service lui-même à NO_PROXY
      - NO_PROXY=${SQUID_NO_PROXY},docker-registry-cache

  apt-cache:
    build: ./apt-cacher-ng
    container_name: apt-cache-server
    restart: always
    ports:
      - "3142:3142" # Port par défaut d'Apt-Cacher-NG
    volumes:
      - ./apt-cache:/var/cache/apt-cacher-ng
      - ./apt-logs:/var/log/apt-cacher-ng
      - ./apt-cacher-ng/conf/acng.conf:/etc/apt-cacher-ng/acng.conf:ro
      - ./apt-cacher-ng/conf/security.conf:/etc/apt-cacher-ng/security.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3142/acng-report.html >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
#    environment:
#      - HTTP_PROXY=${SQUID_PROXY_ADDR}
#      - HTTPS_PROXY=${SQUID_PROXY_ADDR}
#      # Important : Ajoutez le nom du service lui-même à NO_PROXY
#      - NO_PROXY=${SQUID_NO_PROXY},apt-cache

  qbittorrent: # Seed initial pour la distribution des VM aux étudiants (complète le LPD, jugé trop lent dans le labo)
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: always
    environment:
      - PUID=1000 # Remplacez par l'uid de votre utilisateur (commande : id -u)
      - PGID=1000 # Remplacez par le gid de votre utilisateur (commande : id -g)
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881 # Port fixe : pas de port aléatoire à retrouver en cas de souci
    ports:
      - "8080:8080" # WebUI : ajout manuel du .torrent, ou pilotage via l'API depuis un script
      - "6881:6881" # Port BT, TCP
      - "6881:6881/udp" # Port BT, UDP
    volumes:
      - ./qbittorrent/config:/config # Configuration persistante (identifiants WebUI, réglages)
      # Chemin vers les images de VM déjà présentes sur le disque : le .torrent créé pointe
      # vers ce même contenu, qBittorrent vérifie le hash et passe directement en seed
      # (pas de téléchargement, pas besoin de dossier "watch")
      - /chemin/vers/vos/images-vm:/data:ro

  opentracker: # Tracker BitTorrent minimal, en complément du LPD
    image: wiltonsr/opentracker:open # image communautaire — cf. docs/opentracker-provenance.md
    container_name: opentracker
    restart: always
    ports:
      - "6969:6969/tcp"
      - "6969:6969/udp"
    # Diagnostic sans authentification : http://<ip-machine-prof>:6969/stats
