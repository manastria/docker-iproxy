# Serveur HTTP minimal, sans authentification, réservé au réseau du labo.
#
# Deux usages :
# - /torrents/   : publication des fichiers .torrent créés par qBittorrent,
#                  pour que les machines étudiantes les récupèrent.
# - /images-vm/  : webseed HTTP (BEP 19) — source de secours pour le contenu
#                  des .torrent si le BitTorrent ne fonctionne pas (pas de
#                  seed disponible, port bloqué...). À déclarer comme
#                  "url-list" dans le .torrent au moment de sa création.
server {
    listen 80;
    server_name _;

    location /torrents/ {
        alias /usr/share/nginx/html/torrents/;
        autoindex on;
    }

    location /images-vm/ {
        alias /usr/share/nginx/html/images-vm/;
        autoindex on;
    }
}
